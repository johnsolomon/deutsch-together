<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1115">
<title>Deutsch Together</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--panel2:#1f232c;--line:#2a2f3a;--text:#e8eaed;--muted:#8d93a0;--me:#2563eb;--them:#252a34;--green:#3ba776;--warn:#e0a84e;--err:#e06c6c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer}
#app{display:flex;flex-direction:column;height:100dvh;max-width:640px;margin:0 auto}

/* picker */
#picker{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#picker h1{font-size:1.4rem;margin:0 0 8px;font-weight:650}
.who{padding:14px 28px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:1.05rem;font-weight:600}

/* header */
header{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{flex:1;margin:0;font-size:1.02rem;font-weight:650}
#revBtn{display:none;border:none;background:var(--warn);color:#1a1205;font-weight:700;font-size:.78rem;padding:6px 12px;border-radius:14px}
#menuBtn{border:none;background:none;color:var(--muted);font-size:1.3rem;padding:0 4px 0 12px;line-height:1}

/* thread */
#thread{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px}
.empty{margin:auto;text-align:center;color:var(--muted);font-size:.9rem;line-height:1.6;max-width:280px}
.row{display:flex;flex-direction:column;max-width:85%}
.row.me{align-self:flex-end;align-items:flex-end}
.row.them{align-self:flex-start}
.bubble{padding:10px 13px;border-radius:18px;font-size:1.06rem;line-height:1.6}
.me .bubble{background:var(--me);color:#fff;border-bottom-right-radius:6px}
.them .bubble{background:var(--them);border-bottom-left-radius:6px}
.w{border-radius:4px;padding:0 1px}
.w.lit{background:rgba(255,255,255,.18)}
.w.shaky{text-decoration:underline dotted var(--warn);text-underline-offset:4px}
.g{font-size:.72rem;font-style:italic;opacity:.75;margin-left:3px}
.en{display:none;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.15);font-size:.9rem;opacity:.8;line-height:1.4}
.en.show{display:block}
.acts{display:flex;gap:14px;margin:4px 8px 0;font-size:.75rem;color:var(--muted)}
.acts button{border:none;background:none;color:var(--muted);padding:2px 0;font-size:.75rem}
.acts button:active{color:var(--text)}

.note{align-self:center;max-width:92%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 13px;font-size:.88rem;line-height:1.5}
.note .k{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.note.fix{align-self:flex-end;border-color:rgba(224,108,108,.5)}
.note .right{color:var(--green);font-weight:600}
.note .de{color:var(--green);font-weight:600}
.dots span{display:inline-block;width:5px;height:5px;margin:0 1px;border-radius:50%;background:var(--muted);animation:b 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1}}

/* composer */
#composer{display:flex;gap:8px;align-items:flex-end;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel)}
#input{flex:1;resize:none;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:20px;padding:10px 14px;font-size:1rem;font-family:inherit;line-height:1.4;max-height:120px}
#input:focus{outline:none;border-color:var(--me)}
#send{width:42px;height:42px;border-radius:50%;border:none;background:var(--me);color:#fff;font-size:1.1rem;flex-shrink:0}
#send:disabled{opacity:.4}

/* sheet */
#sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:none}
#sheet.show{display:block}
#sheetBody{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:88dvh;overflow-y:auto;background:var(--panel);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sh h2{margin:0;font-size:1.05rem}
.x{border:none;background:none;color:var(--muted);font-size:1.4rem}
.card{background:var(--panel2);border-radius:14px;padding:22px 16px;text-align:center}
.card .q{font-size:1.4rem;font-weight:650}
.card .q.small{font-size:1rem;line-height:1.4}
.card .a{display:none;color:var(--green);font-weight:600;margin-top:10px;line-height:1.4}
.card .a.show{display:block}
.card .n{font-size:.72rem;color:var(--muted);margin-bottom:10px}
.btns{display:flex;gap:8px;justify-content:center;margin-top:16px}
.btns button{padding:9px 18px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-weight:600;font-size:.88rem}
.btns .miss{color:var(--err);border-color:rgba(224,108,108,.5)}
.btns .got{color:var(--green);border-color:rgba(59,167,118,.5)}
.sec{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:22px 0 8px}
.gi{border-top:1px solid var(--line)}
.gi .t{padding:11px 2px;font-size:.93rem;display:flex;justify-content:space-between}
.gi .t::after{content:"›";color:var(--muted)}
.gi.open .t::after{content:"‹"}
.gi .b{display:none;padding:0 2px 12px;font-size:.88rem;line-height:1.55;color:#c9cdd4}
.gi.open .b{display:block}
.gi .ex{margin-top:6px}.gi .ex b{color:var(--green);font-weight:600}
.foot{margin-top:22px;font-size:.8rem;color:var(--muted);text-align:center}
.foot button{border:none;background:none;color:var(--me);font-size:.8rem}
#toast{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:60;font-size:.78rem;padding:6px 12px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);display:none}
</style>
</head>
<body>
<div id="toast"></div>

<div id="picker">
  <h1>Deutsch Together</h1>
  <button class="who" data-who="John">I'm John</button>
  <button class="who" data-who="Murilo">I'm Murilo</button>
</div>

<div id="app" style="visibility:hidden">
  <header>
    <h1>Deutsch Together</h1>
    <button id="revBtn" onclick="openSheet()">Review</button>
    <button id="menuBtn" onclick="openSheet()" aria-label="Menu">≡</button>
  </header>
  <div id="thread"></div>
  <div id="composer">
    <textarea id="input" rows="1" placeholder="English or German"></textarea>
    <button id="send" onclick="handleSend()">↑</button>
  </div>
</div>

<div id="sheet" onclick="if(event.target===this)closeSheet()">
  <div id="sheetBody">
    <div class="sh"><h2>Review</h2><button class="x" onclick="closeSheet()">×</button></div>
    <div id="revArea"></div>
    <div class="sec">Grammar basics</div>
    <div id="gramList"></div>
    <div class="foot">You're <span id="meName"></span> · <button onclick="switchWho()">switch</button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL="https://taiqxxehyfkpgjaiygls.supabase.co";
const SUPABASE_KEY="sb_publishable_HemjsBxnRbCFfDPTZK5K0A_h1jvkgWi";
const FN=SUPABASE_URL+"/functions/v1/bot";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const NEW_WORD_EVERY=10;   // a new word is dropped into the chat every N messages

let me=localStorage.getItem("dt_me");
let messages=[], memory={vocab:{},gram:{}};
const other=()=>me==="John"?"Murilo":"John";

const GRAMMAR=[
 {id:"der-die-das",q:"der / die / das",a:"Every noun is masculine (der), feminine (die) or neuter (das). Learn the gender with the word. All plurals use die.",ex:[["der Tisch, die Lampe, das Buch","the table, the lamp, the book"]]},
 {id:"cases",q:"The 4 cases",a:"The article changes with the noun's job: nominative = subject, accusative = direct object, dative = recipient, genitive = possession.",ex:[["Der Mann sieht den Hund.","The man sees the dog."]]},
 {id:"accusative",q:"Accusative",a:"The thing acted on. Only masculine changes: der → den, ein → einen.",ex:[["Ich habe einen Hund.","I have a dog."]]},
 {id:"dative",q:"Dative",a:"The recipient. der → dem, die → der, das → dem, plural → den. After mit, zu, aus, bei, nach, von, and verbs like helfen, danken.",ex:[["Ich helfe dem Mann.","I help the man."]]},
 {id:"word-order",q:"Verb comes second",a:"In a main sentence the verb is always the second element. If something else comes first, the subject moves behind the verb.",ex:[["Heute gehe ich.","Today I go."]]},
 {id:"time-place",q:"Time before place",a:"When before where — the opposite of English.",ex:[["Ich fahre morgen nach Berlin.","I'm going to Berlin tomorrow."]]},
 {id:"verb-conj",q:"Verb endings",a:"ich -e, du -st, er/sie/es -t, wir -en, ihr -t, sie/Sie -en.",ex:[["ich mache, du machst, wir machen","I do, you do, we do"]]},
 {id:"sein-haben",q:"sein and haben",a:"sein: bin, bist, ist, sind, seid, sind. haben: habe, hast, hat, haben, habt, haben. German says 'I have hunger'.",ex:[["Ich habe Hunger.","I'm hungry."]]},
 {id:"modal-end",q:"Modal verbs",a:"With möchte, kann, will, muss, the main verb goes to the end.",ex:[["Ich möchte Deutsch lernen.","I want to learn German."]]},
 {id:"negation",q:"nicht vs kein",a:"kein = no / not a (before a noun). nicht = everything else.",ex:[["Ich habe kein Auto.","I have no car."]]},
 {id:"questions",q:"Questions",a:"Yes/no: verb first. Otherwise question word (wer, was, wo, wann, wie, warum), then verb.",ex:[["Wo wohnst du?","Where do you live?"]]},
 {id:"formal-you",q:"du vs Sie",a:"du = friends and family. Sie = polite, capitalised, verb like 'they'.",ex:[["Wie geht es dir / Ihnen?","How are you?"]]},
];

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const norm=w=>(w||"").toLowerCase().replace(/[.,!?;:«»"'()„“]/g,"").trim();
function toast(t,ms=3500){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(e._t);if(ms)e._t=setTimeout(()=>e.style.display="none",ms);}

async function bot(payload){
  const r=await fetch(FN,{method:"POST",headers:{Authorization:"Bearer "+SUPABASE_KEY,apikey:SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify(payload)});
  const j=await r.json(); if(!r.ok||j.error) throw new Error(j.error||r.status); return j;
}

/* language is detected, no toggle */
const DE_W=/\b(ich|du|wir|ihr|ist|bin|bist|sind|seid|habe|hast|haben|habt|und|nicht|kein|keine|das|der|den|dem|des|ein|eine|einen|einem|mit|auf|für|zu|ja|nein|wie|wo|wann|warum|wer|heute|morgen|gut|danke|bitte|hallo|tschüss|guten|auch|aber|oder|sehr|noch|schon|mein|meine|dein|deine|geht|gehe|mir|dir|mich|dich|uns|euch|jetzt|hier|viel|essen|arbeit|möchte|kann|muss|will)\b/gi;
const EN_W=/\b(the|is|are|am|you|i|and|to|what|how|my|your|it|of|in|that|this|we|they|have|do|did|was|were|be|for|with|on|at|not|today|tomorrow|good|thanks|hello|hi)\b/gi;
function detectLang(t){
  if(/[äöüß]/i.test(t)) return "de";
  const de=(t.match(DE_W)||[]).length, en=(t.match(EN_W)||[]).length;
  return de>en?"de":"en";
}

/* ---------- memory ---------- */
async function loadMemory(){
  memory={vocab:{},gram:{}};
  const [{data:v},{data:g}]=await Promise.all([
    sb.from("dt_word_memory").select("*").eq("person",me),
    sb.from("dt_grammar_memory").select("*").eq("person",me)]);
  (v||[]).forEach(r=>memory.vocab[r.word]=r);
  (g||[]).forEach(r=>memory.gram[r.pattern]=r);
}
async function bumpWord(word,en,{missed=false,got=false}={}){
  const k=norm(word); if(!k) return;
  const c=memory.vocab[k]||{en,seen:0,revealed:0,missed:0,strength:0};
  c.seen++; if(!c.en)c.en=en;
  if(missed){c.missed++;c.strength=Math.max(0,c.strength-1);}
  else if(got){c.strength=Math.min(5,c.strength+1);}
  else {c.revealed++;c.strength=Math.max(0,Math.min(c.strength,3)-0.5);} // looked it up = still shaky
  memory.vocab[k]=c;
  await sb.from("dt_word_memory").upsert({person:me,word:k,en:c.en,seen:c.seen,revealed:c.revealed,missed:c.missed,strength:c.strength,updated_at:new Date().toISOString()},{onConflict:"person,word"});
  updateRevBtn();
}
async function bumpGram(p,{missed=false}={}){
  const c=memory.gram[p]||{seen:0,missed:0,strength:0};
  c.seen++; if(missed){c.missed++;c.strength=Math.max(0,c.strength-1);} else c.strength=Math.min(5,c.strength+1);
  memory.gram[p]=c;
  await sb.from("dt_grammar_memory").upsert({person:me,pattern:p,seen:c.seen,missed:c.missed,strength:c.strength,updated_at:new Date().toISOString()},{onConflict:"person,pattern"});
  updateRevBtn();
}
const shakyWords=()=>Object.entries(memory.vocab).filter(([k,v])=>v.strength<4&&(v.revealed>0||v.missed>0)).map(([k,v])=>({id:k,front:k,back:v.en||"—",kind:"w"}));
const shakyGram=()=>Object.entries(memory.gram).filter(([k,v])=>v.strength<4&&v.missed>0).map(([k])=>GRAMMAR.find(g=>g.id===k)).filter(Boolean).map(g=>({id:g.id,front:g.q,back:g.a,kind:"g"}));
function updateRevBtn(){const n=shakyWords().length+shakyGram().length;const b=$("revBtn");b.style.display=n?"inline-block":"none";b.textContent="Review "+n;}

/* ---------- messages ---------- */
async function loadMessages(){
  const {data}=await sb.from("dt_messages").select("*").order("created_at",{ascending:true}).limit(500);
  messages=data||[]; render();
}
async function insert(row){const {data,error}=await sb.from("dt_messages").insert(row).select().single();if(error)throw error;return data;}
function subscribe(){
  sb.channel("dt_thread").on("postgres_changes",{event:"INSERT",schema:"public",table:"dt_messages"},p=>{
    if(!messages.find(m=>m.id===p.new.id)){messages.push(p.new);render();}
  }).subscribe();
}

/* ---------- audio: tap = normal, tap again = slower ---------- */
let lastSpeak={k:null,t:0};
function speak(text,key){
  const now=Date.now(); const slow=lastSpeak.k===key&&now-lastSpeak.t<4000;
  lastSpeak={k:key,t:now};
  try{const u=new SpeechSynthesisUtterance(text);u.lang="de-DE";u.rate=slow?0.6:0.9;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}
}

/* ---------- render ---------- */
const thread=$("thread");
function render(){
  thread.innerHTML="";
  if(!messages.length){thread.innerHTML=`<div class="empty">Write in English or German.<br>${esc(other())} sees it in German.<br><br>Tap a word for its meaning.<br>Start a message with <b>?</b> to ask the tutor.</div>`;return;}
  messages.forEach(m=>{
    if(m.kind==="msg") renderMsg(m);
    else if(m.kind==="fix"){ if(m.sender===me) renderFix(m); }
    else renderNote(m);
  });
  thread.scrollTop=thread.scrollHeight;
}
function renderMsg(m){
  const mine=m.sender===me;
  const row=document.createElement("div");row.className="row "+(mine?"me":"them");
  const b=document.createElement("div");b.className="bubble";
  const words=m.de_words||[];
  words.forEach((p,i)=>{
    const s=document.createElement("span");s.className="w";s.textContent=p[0];
    const v=memory.vocab[norm(p[0])];
    if(!mine&&v&&v.strength<4&&(v.revealed||v.missed))s.classList.add("shaky");
    if(p[1]&&p[1]!=="·")s.onclick=()=>{
      const g=s.querySelector(".g");
      if(g){g.remove();s.classList.remove("lit");}
      else{s.classList.add("lit");s.insertAdjacentHTML("beforeend",`<span class="g">${esc(p[1])}</span>`);if(!mine)bumpWord(p[0],p[1]);}
    };
    b.appendChild(s); if(i<words.length-1)b.appendChild(document.createTextNode(" "));
  });
  const en=document.createElement("div");en.className="en";en.textContent=m.en_text||"";b.appendChild(en);
  row.appendChild(b);
  const a=document.createElement("div");a.className="acts";
  const hear=document.createElement("button");hear.textContent="🔊";hear.onclick=()=>speak(words.map(p=>p[0]).join(" "),m.id);
  const rev=document.createElement("button");rev.textContent="English";
  rev.onclick=()=>{const on=en.classList.toggle("show");rev.textContent=on?"Hide":"English";if(on&&!mine&&m.pattern&&!en._counted){en._counted=1;bumpGram(m.pattern,{missed:true});}};
  const ask=document.createElement("button");ask.textContent="Explain";ask.onclick=()=>explain(m);
  a.append(hear,rev,ask);
  if(!mine){const t=document.createElement("span");t.textContent=m.sender;t.style.marginLeft="auto";a.appendChild(t);}
  row.appendChild(a); thread.appendChild(row);
}
function renderFix(m){
  const p=m.payload||{};
  thread.insertAdjacentHTML("beforeend",`<div class="note fix"><div class="k">Correction · only you see this</div>${esc(p.wrong)} → <span class="right">${esc(p.right)}</span>${p.why?`<div style="color:var(--muted);margin-top:3px">${esc(p.why)}</div>`:""}</div>`);
}
function renderNote(m){
  const p=m.payload||{};
  if(m.kind==="newword"){
    const ex=p.example||["",""];
    const d=document.createElement("div");d.className="note";
    d.innerHTML=`<div class="k">New word</div><span class="de">${esc(p.de)}</span> — ${esc(p.en)}${ex[0]?`<div style="margin-top:4px">${esc(ex[0])} <span style="color:var(--muted)">· ${esc(ex[1])}</span></div>`:""}`;
    d.onclick=()=>speak(p.de,"nw"+m.id); thread.appendChild(d); return;
  }
  // tutor answer
  thread.insertAdjacentHTML("beforeend",`<div class="note"><div class="k">Tutor${p.q?" · "+esc(p.q):""}</div>${p.html?p.html:esc(p.text||"")}</div>`);
}
function typing(on){
  const t=$("typing"); if(t)t.remove();
  if(on){thread.insertAdjacentHTML("beforeend",`<div class="note" id="typing"><span class="dots"><span></span><span></span><span></span></span></div>`);thread.scrollTop=thread.scrollHeight;}
}

/* ---------- send ---------- */
let busy=false;
async function handleSend(){
  const inp=$("input"); const txt=inp.value.trim(); if(!txt||busy) return;
  inp.value=""; inp.style.height="auto"; busy=true; $("send").disabled=true; typing(true);
  try{
    if(txt.startsWith("?")) { await askTutor(txt.slice(1).trim()); return; }
    const lang=detectLang(txt);
    let text=txt;
    if(lang==="de"){
      let v; try{v=await bot({action:"validate",text:txt});}catch(e){v={ok:true};}
      if(v&&v.ok===false&&v.right){ await insert({sender:me,kind:"fix",payload:{wrong:v.wrong||txt,right:v.right,why:v.why||""}}); text=v.right; }
    }
    const tr=await bot({action:"translate",text,from:lang});
    await insert({sender:me,kind:"msg",typed_lang:lang,de_words:tr.de,en_text:tr.en,pattern:tr.pattern||null});
    maybeNewWord();
  }catch(e){
    inp.value=txt; toast("Couldn't send — try again");
  }finally{ typing(false); busy=false; $("send").disabled=false; }
}
async function askTutor(q){
  if(!q){return;}
  const recent=messages.filter(m=>m.kind==="msg").slice(-3).map(m=>(m.de_words||[]).map(p=>p[0]).join(" ")).join(" | ");
  const r=await bot({action:"tutor",question:q,context:recent});
  await insert({sender:"bot",kind:"tutor",payload:{q,text:r.answer}});
}
async function explain(m){
  typing(true);
  try{
    const de=(m.de_words||[]).map(p=>p[0]).join(" ");
    const r=await bot({action:"tutor",question:"Explain this sentence for a beginner: what each part does and the one grammar point worth learning from it. Keep it short.",context:de});
    await insert({sender:"bot",kind:"tutor",payload:{q:de,text:r.answer}});
    if(m.pattern&&m.sender!==me) bumpGram(m.pattern,{missed:true});
  }catch(e){toast("Tutor busy — try again");}
  finally{typing(false);}
}
async function maybeNewWord(){
  let since=0;
  for(let i=messages.length-1;i>=0;i--){ if(messages[i].kind==="newword")break; if(messages[i].kind==="msg")since++; }
  if(since<NEW_WORD_EVERY) return;
  try{
    const r=await bot({action:"newword",known:Object.keys(memory.vocab).slice(0,200)});
    await insert({sender:"bot",kind:"newword",payload:{de:r.de,en:r.en,example:r.example}});
  }catch(e){}
}

/* ---------- review sheet ---------- */
let queue=[],qi=0;
function openSheet(){queue=shakyWords().concat(shakyGram());qi=0;renderReview();renderGram();$("meName").textContent=me;$("sheet").classList.add("show");}
function closeSheet(){$("sheet").classList.remove("show");render();}
function renderReview(){
  const a=$("revArea");
  if(!queue.length){a.innerHTML=`<div class="card"><div style="color:var(--muted);font-size:.9rem;line-height:1.5">Nothing to review.<br>Words you tap and sentences you need help with show up here.</div></div>`;return;}
  if(qi>=queue.length){a.innerHTML=`<div class="card"><div class="q small">Done · ${queue.length} reviewed</div></div>`;return;}
  const c=queue[qi], small=c.kind==="g";
  a.innerHTML=`<div class="card"><div class="n">${qi+1} / ${queue.length}</div><div class="q ${small?"small":""}">${esc(c.front)}</div><div class="a" id="ans">${esc(c.back)}</div>
   <div class="btns" id="b1"><button onclick="$('ans').classList.add('show');$('b1').style.display='none';$('b2').style.display='flex'">Show</button>${c.kind==="w"?`<button onclick="speak('${esc(c.front).replace(/'/g,"")}','r${qi}')">🔊</button>`:""}</div>
   <div class="btns" id="b2" style="display:none"><button class="miss" onclick="grade(true)">Missed</button><button class="got" onclick="grade(false)">Got it</button></div></div>`;
}
async function grade(missed){
  const c=queue[qi];
  if(c.kind==="w") await bumpWord(c.front,c.back,missed?{missed:true}:{got:true});
  else await bumpGram(c.id,{missed});
  qi++; renderReview();
}
function renderGram(){
  $("gramList").innerHTML=GRAMMAR.map(g=>`<div class="gi" onclick="this.classList.toggle('open')"><div class="t">${esc(g.q)}</div><div class="b">${esc(g.a)}${g.ex.map(e=>`<div class="ex"><b>${esc(e[0])}</b> — ${esc(e[1])}</div>`).join("")}</div></div>`).join("");
}

/* ---------- start ---------- */
async function setWho(w){
  me=w; localStorage.setItem("dt_me",w);
  $("picker").style.display="none"; $("app").style.visibility="visible";
  try{ await loadMemory(); await loadMessages(); updateRevBtn(); }catch(e){ toast("Connection problem",0); }
}
async function switchWho(){ closeSheet(); await setWho(other()); }
document.querySelectorAll(".who").forEach(b=>b.onclick=()=>{setWho(b.dataset.who);subscribe();});
const inp=$("input");
inp.addEventListener("input",()=>{inp.style.height="auto";inp.style.height=Math.min(inp.scrollHeight,120)+"px";});
inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();handleSend();}});
if(me){ setWho(me); subscribe(); }
</script>
</body>
